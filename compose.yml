services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zomi
      POSTGRES_USER: zomi
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zomi -d zomi"]
      interval: 5s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/zomi
      DATABASE_USER: zomi
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      DEMO_CONTENT: ${DEMO_CONTENT:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BASE_URL: ${BASE_URL:-http://localhost:8088}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
  web:
    build: ./frontend
    ports: ["127.0.0.1:8088:80"]
    depends_on: [backend]
volumes:
  postgres:
